<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>CAOS · Bar Compare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/scenes/caos.css">
<style>
  /*
    CAOS scene: BAR COMPARE
    Saylor-style horizontal asset comparison.
    Params:
      ?title=Bitcoin vs Gold
      &items=Bitcoin:2100,Gold:16000,Real Estate:330000
      &unit=B USD
      &highlight=Bitcoin        item drawn in accent color (default: first)
      &accent=orange|green|blue|white
  */
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    padding: 60px 8vw;
  }

  #title {
    font-weight: 900;
    font-size: clamp(30px, 4.2vw, 64px);
    letter-spacing: -0.01em;
    text-align: center;
    animation: caosRevealUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  #title em {
    font-style: normal;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(var(--accent-rgb), 0.4);
  }

  #bars {
    width: 100%;
    max-width: 1400px;
    display: flex; flex-direction: column;
    gap: 26px;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(140px, 0.22fr) 1fr;
    align-items: center;
    gap: 26px;
    animation: caosRevealUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .name {
    font-weight: 800;
    font-size: clamp(18px, 2vw, 32px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: right;
    color: var(--caos-muted);
  }
  .row.hl .name { color: var(--caos-white); }

  .track { display: flex; align-items: center; gap: 18px; min-width: 0; }

  .bar {
    height: clamp(30px, 4.6vh, 52px);
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(150,170,205,0.72), rgba(104,126,168,0.5));
    border: 1px solid rgba(190,210,240,0.32);
    box-shadow: 0 2px 16px rgba(0,0,0,0.28);
    transform-origin: left center;
    animation: caosLineGrow 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    flex-shrink: 0;
  }
  .row.hl .bar {
    background: linear-gradient(90deg, var(--accent), rgba(var(--accent-rgb), 0.6));
    border-color: rgba(var(--accent-rgb), 0.55);
    box-shadow: 0 0 34px rgba(var(--accent-rgb), 0.4);
  }

  .val {
    font-family: var(--caos-mono);
    font-weight: 700;
    font-size: clamp(17px, 1.9vw, 30px);
    white-space: nowrap;
    color: var(--caos-white);
    opacity: 0;
    animation: caosRevealUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .row.hl .val { color: var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="title"></div>
  <div id="bars"></div>
</div>
<script>
  const P = new URLSearchParams(location.search);
  document.body.dataset.accent = P.get('accent') || 'orange';

  const unit      = P.get('unit') || '';
  const highlight = (P.get('highlight') || '').toLowerCase();

  // "Bitcoin:2100,Gold:16000" → [{name, value}]
  const items = (P.get('items') || 'Bitcoin:2100,Gold:16000,Real Estate:330000')
    .split(',')
    .map(pair => {
      const i = pair.lastIndexOf(':');
      return { name: pair.slice(0, i).trim(), value: parseFloat(pair.slice(i + 1)) || 0 };
    })
    .filter(it => it.name);

  const rawTitle = P.get('title') || 'Comparación';
  // Highlight the accent word inside the title if it matches an item
  const hlName = highlight || (items[0]?.name.toLowerCase() ?? '');
  document.getElementById('title').innerHTML = rawTitle.replace(
    new RegExp(`(${hlName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i'),
    '<em>$1</em>'
  );

  const max  = Math.max(...items.map(it => it.value), 1);
  const bars = document.getElementById('bars');

  function fmt(v) {
    if (v >= 1e6) return (v / 1e6).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'M';
    if (v >= 1e3) return (v / 1e3).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'K';
    return v.toLocaleString('en-US', { maximumFractionDigits: 1 });
  }

  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (it.name.toLowerCase() === hlName ? ' hl' : '');
    row.style.animationDelay = (0.25 + i * 0.18) + 's';

    // Cap the largest bar at 78% of the track so the value label always
    // fits to its right; floor tiny bars at 4% so they stay visible.
    const pct = Math.max((it.value / max) * 78, 4);
    row.innerHTML = `
      <div class="name">${it.name}</div>
      <div class="track">
        <div class="bar" style="width:${pct}%;animation-delay:${0.4 + i * 0.18}s"></div>
        <div class="val" style="animation-delay:${1.1 + i * 0.18}s">${fmt(it.value)}${unit ? ' ' + unit : ''}</div>
      </div>`;
    bars.appendChild(row);
  });
</script>
</body>
</html>
