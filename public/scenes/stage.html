<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>CAOS · Stage</title>
<style>
  /*
    CAOS VISUAL ENGINE — STAGE
    ──────────────────────────
    The single OBS browser source. Loads any scene on demand via WS.

    OBS setup:  https://<host>/stage?token=XXX   (1920×1080, transparent)

    WS messages:
      scene_show   { scene: "keyword", params: {text:"BITCOIN"}, duration: 0 }
      scene_hide   {}
    duration in ms; 0 = stay until next scene or scene_hide.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

  .scene-frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: transparent;
    opacity: 0;
    transform: scale(1.015);
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .scene-frame.on { opacity: 1; transform: scale(1); }

  #dot {
    position: fixed; top: 8px; right: 12px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #ef4444; opacity: 0.4; transition: all 0.3s;
  }
  #dot.ok { background: #27d17f; box-shadow: 0 0 6px rgba(39,209,127,0.7); opacity: 1; }
</style>
</head>
<body>
<div id="dot"></div>
<script>
(() => {
  const P      = new URLSearchParams(location.search);
  const TOKEN  = P.get('token') || '';
  const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}?role=stage`
               + (TOKEN ? `&token=${encodeURIComponent(TOKEN)}` : '');

  const dot = document.getElementById('dot');
  let currentFrame = null;
  let hideTimer    = null;

  const SCENE_NAME_RE = /^[a-z0-9-]+$/;

  function showScene(name, params = {}, duration = 0) {
    if (!SCENE_NAME_RE.test(name)) return;
    clearTimeout(hideTimer);

    const qs  = new URLSearchParams(params).toString();
    const src = `/scene/${name}${qs ? '?' + qs : ''}`;

    const frame = document.createElement('iframe');
    frame.className = 'scene-frame';
    frame.setAttribute('allowtransparency', 'true');
    frame.src = src;
    document.body.appendChild(frame);

    const old = currentFrame;
    currentFrame = frame;

    frame.addEventListener('load', () => {
      requestAnimationFrame(() => frame.classList.add('on'));
      if (old) {
        old.classList.remove('on');
        setTimeout(() => old.remove(), 500);
      }
    });
    // Safety: if load never fires (404), clean up after 4 s
    setTimeout(() => { if (!frame.classList.contains('on')) frame.classList.add('on'); }, 4000);

    if (duration > 0) hideTimer = setTimeout(hideScene, duration);
  }

  function hideScene() {
    clearTimeout(hideTimer);
    if (!currentFrame) return;
    const f = currentFrame;
    currentFrame = null;
    f.classList.remove('on');
    setTimeout(() => f.remove(), 500);
  }

  // ── WebSocket with auto-reconnect ──
  let ws, delay = 2500;
  function connect() {
    try { ws = new WebSocket(WS_URL); } catch { return retry(); }
    ws.onopen    = () => { dot.className = 'ok'; delay = 2500; };
    ws.onclose   = () => { dot.className = ''; retry(); };
    ws.onerror   = () => ws.close();
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'scene_show') {
        showScene(String(msg.scene || ''), msg.params || {}, Number(msg.duration) || 0);
      }
      if (msg.type === 'scene_hide') hideScene();
    };
  }
  function retry() {
    setTimeout(connect, delay);
    delay = Math.min(delay * 1.5, 25000);
  }
  connect();
})();
</script>
</body>
</html>
